<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pinkcity.Go</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar"><a class="logo" href="index.html"><span>Pinkcity</span>.Go</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions"></div>
    </nav>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Welcome back</h1>
            <p>Login to view your saved journeys.</p>
            <form id="loginForm" class="simple-form">
                <div class="field"><label for="login-email">Email address</label><input id="login-email" type="email"
                        placeholder="you@example.com" required></div>
                <div class="field"><label for="login-password">Password</label><input id="login-password"
                        type="password" placeholder="Enter your password" required></div><button class="btn"
                    type="submit">Login</button>
                <p class="form-message"></p>
            </form>
            <p class="auth-switch">New to Pinkcity.Go? <a href="register.html">Create an account</a></p>
        </section>
    </main>
    <footer>
        <div><a class="logo" href="index.html"><span style="font-size: 20px;">Pinkcity.Go</span></a>
            <p>Simple public transport information for everyone.</p>
        </div>
        <p>© 2026 Pinkcity.Go. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
